name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Sin secretos configurados, las pruebas de integración se saltan solas y
      # solo corren las de dominio. Con DATABASE_URL corren las de aislamiento,
      # que son el gate real de docs/09 §3.
      - name: Pruebas
        run: npm test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PUBLISHER_DATABASE_URL: ${{ secrets.PUBLISHER_DATABASE_URL }}

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
